name: Pytest

on:
  push:
    paths:
      - "backend/**"
      - "data/eval/**"
      - ".github/workflows/pytest.yml"
  pull_request:
    paths:
      - "backend/**"
      - "data/eval/**"
      - ".github/workflows/pytest.yml"

jobs:
  unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Run unit tests
        env:
          EMBEDDING_BACKEND: hash
        run: pytest -q

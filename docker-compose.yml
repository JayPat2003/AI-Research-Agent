services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: research
      POSTGRES_PASSWORD: research
      POSTGRES_DB: research
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U research -d research"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://research:research@postgres:5432/research
      DATABASE_URL_SYNC: postgresql+psycopg://research:research@postgres:5432/research
      REDIS_URL: redis://redis:6379/0
      HF_HOME: /models
      UPLOAD_DIR: /data/uploads
      SEED_DIR: /data/seed
      EVAL_PATH: /data/eval/questions.jsonl
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
      - hf_models:/models
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: python -m app.worker
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://research:research@postgres:5432/research
      DATABASE_URL_SYNC: postgresql+psycopg://research:research@postgres:5432/research
      REDIS_URL: redis://redis:6379/0
      HF_HOME: /models
      UPLOAD_DIR: /data/uploads
      SEED_DIR: /data/seed
    volumes:
      - ./data:/data
      - hf_models:/models
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
  hf_models:

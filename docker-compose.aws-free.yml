# Free-tier overlay for t3.micro (1GB RAM + swap).
# Usage on EC2:
#   docker compose -f docker-compose.yml -f docker-compose.aws.yml -f docker-compose.aws-free.yml up -d --build
#
# Notes:
# - EMBEDDING_BACKEND=hash (no BGE download; lighter RAM use)
# - Memory limits to reduce OOM risk on small instances
# - Gemini for LLM calls (Google AI Studio key)

services:
  api:
    environment:
      EMBEDDING_BACKEND: hash
      OLLAMA_FALLBACK: "false"
      LLM_PROVIDER: gemini
      RERANK_K: "5"
      DENSE_K: "10"
      SPARSE_K: "10"
    mem_limit: 512m

  worker:
    environment:
      EMBEDDING_BACKEND: hash
      OLLAMA_FALLBACK: "false"
      LLM_PROVIDER: gemini
    mem_limit: 384m

  web:
    mem_limit: 256m

  postgres:
    mem_limit: 256m

  redis:
    mem_limit: 64m

  caddy:
    mem_limit: 64m
